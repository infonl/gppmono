# The ReadTheDocs requirement set had no build check in this repo. #51 bumped
# three pins in it and the only verification was a local sphinx run.
name: gpp-app docs

on:
  push:
    branches: [main]
    paths:
      - 'services/gpp-app/docs/**'
      - '.github/workflows/gpp-app-docs.yml'
  pull_request:
    paths:
      - 'services/gpp-app/docs/**'
      - '.github/workflows/gpp-app-docs.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: services/gpp-app/docs

jobs:
  build:
    name: Build the documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.12
      - name: Install the pinned requirement set
        run: |
          uv venv -p 3.12
          uv pip sync requirements.txt
      - name: Build HTML
        run: .venv/bin/sphinx-build -b html . _build/html
