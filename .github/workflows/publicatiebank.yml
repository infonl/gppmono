# Root copy of services/publicatiebank/.github/workflows/{ci,code-quality}.yml.
# The vendored ones never run: GitHub only reads .github/workflows at the repo
# root, so every change to this service merged unverified. Ported rather than
# rewritten, so upstream stays the reference; the only additions are the path
# filter and working-directory.
name: publicatiebank

on:
  push:
    branches: [main]
    paths:
      - 'services/publicatiebank/**'
      - '.github/workflows/publicatiebank.yml'
  pull_request:
    paths:
      - 'services/publicatiebank/**'
      - '.github/workflows/publicatiebank.yml'
  workflow_dispatch:

env:
  DJANGO_SETTINGS_MODULE: woo_publications.conf.ci

defaults:
  run:
    working-directory: services/publicatiebank

jobs:
  ruff:
    name: Lint with ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up backend environment
        uses: maykinmedia/setup-django-backend@v1.3
        with:
          python-version: '3.12'
          setup-node: 'no'
          working-directory: services/publicatiebank
      - run: |
          ruff check --output-format=github .
          ruff format --check

  tests:
    name: Run the Django test suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        # Needed because the postgres container does not provide a healthcheck
        options: >-
          --name postgres
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:6
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      - name: Set up backend environment
        uses: maykinmedia/setup-django-backend@v1.3
        with:
          python-version: '3.12'
          optimize-postgres: 'yes'
          pg-service: 'postgres'
          setup-node: 'yes'
          # The service's .nvmrc is not at the repo root, which is where
          # setup-node looks by default.
          nvmrc-custom-dir: 'services/publicatiebank'
          working-directory: services/publicatiebank

      - name: Add host.docker.internal hostname to DNS resolution
        run: |
          sudo echo "127.0.0.1 host.docker.internal openzaak.docker.internal" | sudo tee -a /etc/hosts

      - name: Run tests
        run: |
          python src/manage.py compilemessages
          python src/manage.py collectstatic --noinput --link
          python src/manage.py test src
        env:
          SECRET_KEY: dummy
          DB_USER: postgres
          DB_PASSWORD: ''
